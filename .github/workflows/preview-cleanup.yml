name: Preview cleanup

# Keeps preview deployments (published by the CI workflow) temporary: a preview is
# removed when its branch is deleted, and the daily cleanup removes previews that have
# not been refreshed for PREVIEW_DAYS days. GitHub runs these triggers from main only.
on:
  delete:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  PREVIEW_DAYS: 14

permissions:
  contents: write

# Shared with CI and the release workflow: one writer to gh-pages at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  remove:
    name: Remove preview of deleted branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove
        env:
          BRANCH: ${{ github.event.ref }}
        run: bash scripts/pages.sh remove "$(bash scripts/pages.sh slug "$BRANCH")"

  prune:
    name: Remove expired previews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/pages.sh prune "$PREVIEW_DAYS"
