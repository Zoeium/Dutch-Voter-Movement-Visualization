name: Test site cleanup

# Keeps the test site (published by the CI workflow at /test/) temporary: it is removed
# when the branch it shows is deleted, and the daily cleanup removes it once nothing has
# been deployed to it for TEST_SITE_DAYS days. GitHub runs these triggers from main only.
on:
  delete:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  TEST_SITE_DAYS: 14

permissions:
  contents: write

# Shared with CI and the release workflow: one writer to gh-pages at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  remove:
    name: Remove test site of deleted branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove
        env:
          BRANCH: ${{ github.event.ref }}
        run: bash scripts/pages.sh remove-test "$BRANCH"

  prune:
    name: Remove expired test site
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/pages.sh prune "$TEST_SITE_DAYS"
