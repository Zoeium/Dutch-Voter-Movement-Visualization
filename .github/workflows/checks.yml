name: Checks

# The code and data checks, shared by CI (every push and pull request) and the release
# workflow, so a release is held to exactly the same checks.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  code:
    name: Code (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  tests:
    # The unit tests and the data consistency tests run together: the data tests read every
    # country through the real loader, so coverage is only complete with both.
    name: Tests (unit and data, with coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Fails when coverage drops below the thresholds in vite.config.ts.
      - run: npm run test:coverage
      - name: Keep the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
