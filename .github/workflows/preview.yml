name: Preview

# Temporary test deployments of branches (main included) at
#   https://<owner>.github.io/<repository>/preview/<branch>/
# A preview is refreshed after every push whose checks pass, removed when its branch is
# deleted, and removed by the daily cleanup once it has not been refreshed for
# PREVIEW_DAYS days. Releases at the site root are not affected.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  delete:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

env:
  PREVIEW_DAYS: 14

permissions:
  contents: write

# Shared with the release workflow: only one job writes to gh-pages at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy preview
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Preview name
        id: preview
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          slug="$(bash scripts/pages.sh slug "$BRANCH")"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          # Shown next to the version number, so testers know this is not a release.
          echo "suffix= (preview $BRANCH, ${SHA::7})" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run build
        env:
          APP_VERSION_SUFFIX: ${{ steps.preview.outputs.suffix }}
      - name: Publish
        run: bash scripts/pages.sh preview "${{ steps.preview.outputs.slug }}" dist
      - name: Summary
        run: |
          url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/preview/${{ steps.preview.outputs.slug }}/"
          echo "Preview: $url (removed after $PREVIEW_DAYS days without a new push)" >> "$GITHUB_STEP_SUMMARY"

  remove:
    name: Remove preview of deleted branch
    if: github.event_name == 'delete' && github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove
        env:
          BRANCH: ${{ github.event.ref }}
        run: bash scripts/pages.sh remove "$(bash scripts/pages.sh slug "$BRANCH")"

  prune:
    name: Remove expired previews
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/pages.sh prune "$PREVIEW_DAYS"
