name: Release

# Runs when a version tag is pushed (see docs/RELEASING.md): checks, builds,
# publishes the site to GitHub Pages and creates the GitHub release.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

# Shared with the CI preview job and the cleanup: only one job writes to gh-pages at a time.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/checks.yml

  build:
    name: Build site
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npm run build
      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}" > release-notes.md
      - name: Package the site
        run: (cd dist && zip -r "../site-$GITHUB_REF_NAME.zip" .)
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          include-hidden-files: true
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            release-notes.md
            site-*.zip

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The release goes to the root of the gh-pages branch; branch previews under
      # /preview/ are kept (see scripts/pages.sh and the preview workflow).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - run: bash scripts/pages.sh release site

  release:
    name: Create GitHub release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" site-*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md
